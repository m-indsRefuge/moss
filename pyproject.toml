[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moss"
version = "0.1.0"
description = "Moss - a terminal pet that feeds on your git activity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
moss = "moss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]